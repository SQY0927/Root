name: Build KernelSU Kernel Module

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      package_name:
        description: 'package name of manager'
        required: false
        default: ''
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      package_name:
        description: 'package name of manager'
        required: false
        default: ''
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Build kernelsu.ko
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
        EXPECTED_SIZE: ${{ inputs.expected_size }}
        EXPECTED_HASH: ${{ inputs.expected_hash }}
      run: |
        git config --global --add safe.directory /__w/KernelSU/KernelSU

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$PACKAGE_NAME" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_PACKAGE_NAME=$PACKAGE_NAME"
        fi
        if [ -n "$EXPECTED_SIZE" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
        fi
        if [ -n "$EXPECTED_HASH" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_HASH=$EXPECTED_HASH"
        fi
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_IS_PR_BUILD=1"
        fi
        CONFIG_KSU=m CC=clang make $EXTRA_ARGS
        
        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/aarch64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"
        
        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"

    - name: Upload kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: aarch64-${{ inputs.kmi }}-lkm
        path: /github/workspace/out/aarch64/${{ inputs.kmi }}_kernelsu.ko

    - name: Build kernelsu.ko for x64
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
        EXPECTED_SIZE: ${{ inputs.expected_size }}
        EXPECTED_HASH: ${{ inputs.expected_hash }}
      run: |
        cd kernel
        make clean

        echo "=== Preparing KDIR for x64 ==="

        mkdir -p /opt/ddk/kdir-x64
        unset ARCH
        unset CROSS_COMPILE
        export ARCH=x86_64
        kmi=${{ inputs.kmi }}
        pushd /opt/ddk/src/$kmi
        export KDIR=/opt/ddk/kdir-x64/$kmi

        # ddk-min images contain the source tarball, whose modpost patch is
        # not applied to the fresh x86 kdir.  Keep the patch idempotent so
        # this also works when the image already contains one or more fixes.
        MODPOST=scripts/mod/modpost.c
        sed -i -E 's/^([[:space:]]*)check_exports\(mod\);/\1\/\/ check_exports(mod);/' "$MODPOST"
        sed -i -E 's/^([[:space:]]*)s->module = exp->module;/\1\/\/ s->module = exp->module;/' "$MODPOST"
        sed -i 's/^static void check_exports(/static void __attribute__((unused)) check_exports(/' "$MODPOST"
        sed -i 's/__version_ext_names\\") =\\n/__version_ext_names\\") = \\"\\"\\n/' "$MODPOST"

        make O=$KDIR gki_defconfig
        scripts/config --file $KDIR/.config -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO
        if [ "$kmi" == "android16-6.12" ] || [ "$kmi" == "android17-6.18" ]; then
            scripts/config --file $KDIR/.config -e CONFIG_CFI_ICALL_NORMALIZE_INTEGERS
        fi
        make O=$KDIR modules_prepare
        # Generate SELinux headers through Kbuild in this x86 output tree.
        make O=$KDIR security/selinux/built-in.a
        popd
        
        echo "=== Building x64 kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$PACKAGE_NAME" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_PACKAGE_NAME=$PACKAGE_NAME"
        fi
        if [ -n "$EXPECTED_SIZE" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
        fi
        if [ -n "$EXPECTED_HASH" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_HASH=$EXPECTED_HASH"
        fi
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_IS_PR_BUILD=1"
        fi
        
        MDIR=$(realpath .)

        if [ "$kmi" == "android17-6.18" ]; then
          make -C $KDIR M=$MDIR MO=$MDIR compile_commands.json modules CONFIG_KSU=m CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y $EXTRA_ARGS
        else
          make -C $KDIR M=$MDIR src=$MDIR compile_commands.json modules CONFIG_KSU=m CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y $EXTRA_ARGS
        fi
        
        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/x86_64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"
        
        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        
    - name: Upload x64 kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: x86_64-${{ inputs.kmi }}-lkm
        path: /github/workspace/out/x86_64/${{ inputs.kmi }}_kernelsu.ko

    # Only android14-6.1 has RISC-V GKI support in the Android common kernel
    # (build.config.gki.riscv64 plus arch/riscv gki configs).  Other KMIs have
    # no RISC-V GKI defconfig, so there is no compatible ko to build for them.
    - name: Build kernelsu.ko for riscv64
      if: ${{ inputs.kmi == 'android14-6.1' }}
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
        EXPECTED_SIZE: ${{ inputs.expected_size }}
        EXPECTED_HASH: ${{ inputs.expected_hash }}
      run: |
        cd kernel

        kmi="${{ inputs.kmi }}"
        KDIR=/opt/ddk/kdir-riscv64/$kmi
        export KDIR

        echo "=== Preparing KDIR for riscv64 ==="

        mkdir -p "$KDIR"
        unset ARCH
        unset CROSS_COMPILE
        export ARCH=riscv

        # Mirror AOSP's riscv GKI toolchain: clang with the riscv64-linux-gnu
        # target (LLVM=1), where CROSS_COMPILE only selects the triple.  Only
        # fall back to a real riscv64 GNU toolchain when clang cannot target
        # riscv64, and fail early with a readable error otherwise.
        if echo 'int x;' | clang --target=riscv64-linux-gnu -x c -c -o /dev/null - >/dev/null 2>&1; then
            export LLVM=1
            export CROSS_COMPILE=riscv64-linux-gnu-
            echo "riscv64 toolchain: LLVM=1 (clang --target=riscv64-linux-gnu)"
        elif command -v riscv64-linux-gnu-gcc >/dev/null 2>&1; then
            export CROSS_COMPILE=riscv64-linux-gnu-
            echo "riscv64 toolchain: GNU ${CROSS_COMPILE}gcc"
        else
            echo "ERROR: no riscv64-capable toolchain in this image: clang cannot target riscv64 and riscv64-linux-gnu-gcc is missing" >&2
            exit 1
        fi

        pushd /opt/ddk/src/$kmi

        # Fail with an explicit reason instead of letting cat create an empty
        # .config when this KMI ships no riscv64 GKI config fragments.
        for cfg in arch/riscv/configs/gki_defconfig \
                   arch/riscv/configs/64-bit.config \
                   arch/riscv/configs/gki.config; do
            if [ ! -f "$cfg" ]; then
                echo "ERROR: /opt/ddk/src/$kmi/$cfg is missing; $kmi has no riscv64 GKI defconfig" >&2
                exit 1
            fi
        done

        # Same idempotent modpost patch as the x64 build above.
        MODPOST=scripts/mod/modpost.c
        sed -i -E 's/^([[:space:]]*)check_exports\(mod\);/\1\/\/ check_exports(mod);/' "$MODPOST"
        sed -i -E 's/^([[:space:]]*)s->module = exp->module;/\1\/\/ s->module = exp->module;/' "$MODPOST"
        sed -i 's/^static void check_exports(/static void __attribute__((unused)) check_exports(/' "$MODPOST"
        sed -i 's/__version_ext_names\\") =\\n/__version_ext_names\\") = \\"\\"\\n/' "$MODPOST"

        # Mirror AOSP's PRE_DEFCONFIG_CMDS in build.config.gki.riscv64:
        # arch/riscv/configs/gki_defconfig + 64-bit.config + gki.config.
        cat arch/riscv/configs/gki_defconfig \
            arch/riscv/configs/64-bit.config \
            arch/riscv/configs/gki.config > $KDIR/.config
        make O=$KDIR olddefconfig
        scripts/config --file $KDIR/.config -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO
        make O=$KDIR modules_prepare
        # Generate SELinux headers through Kbuild in this riscv output tree.
        make O=$KDIR security/selinux/built-in.a
        popd

        # Drop objects left by the aarch64/x86_64 steps.  This clean needs a
        # populated $KDIR, so it runs after the kernel tree is prepared.
        make -C "$KDIR" M=$(pwd) src=$(pwd) clean
        rm -f check_symbol

        echo "=== Building riscv64 kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$PACKAGE_NAME" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_PACKAGE_NAME=$PACKAGE_NAME"
        fi
        if [ -n "$EXPECTED_SIZE" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
        fi
        if [ -n "$EXPECTED_HASH" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_HASH=$EXPECTED_HASH"
        fi
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_IS_PR_BUILD=1"
        fi

        MDIR=$(realpath .)
        make -C $KDIR M=$MDIR src=$MDIR compile_commands.json modules CONFIG_KSU=m $EXTRA_ARGS

        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/riscv64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"

        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"

    - name: Upload riscv64 kernelsu.ko artifact
      if: ${{ inputs.kmi == 'android14-6.1' }}
      uses: actions/upload-artifact@v7
      with:
        name: riscv64-${{ inputs.kmi }}-lkm
        path: /github/workspace/out/riscv64/${{ inputs.kmi }}_kernelsu.ko
